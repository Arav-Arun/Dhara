[project]
name = "dhara"
version = "0.1.0"
description = "Retrieval across India's 2024 criminal-law transition (IPC/CrPC/IEA -> BNS/BNSS/BSA)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "typer>=0.12",
    "pymupdf>=1.24",
    "duckdb>=1",
    "polars>=1",
    "beautifulsoup4>=4.15.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "bm25s>=0.3.15",
    "flagembedding>=1.4.2",
    "torch>=2.14.1",
    "openai>=3.40.0",
    "sentence-transformers>=6.2.0",
    "datasets>=5.1.0",
    "accelerate>=1.15.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "mypy>=1.11",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "ipykernel>=7.4.0",
]

[project.scripts]
dhara = "dhara.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dhara"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# PyMuPDF ships without type hints; ingestion code talks to it directly
module = ["dhara.statutes_pdf", "dhara.statutes", "dhara.judgments", "dhara.index", "dhara.retrieve", "dhara.evaluate", "dhara.bench", "dhara.rerank", "dhara.train_reranker"]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "scipy", "scipy.*", "bm25s", "bm25s.*", "FlagEmbedding", "FlagEmbedding.*", "datasets", "datasets.*"]
ignore_missing_imports = true
